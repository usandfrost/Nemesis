# OpenOCD for tools/board_script.py: the ST-Link on the Drumboy's SWD header, attaching WITHOUT resetting the board (the script resets it when it asks to).
# AP_NUM 0 is what the STM32H7 target script of the OpenOCD in STM32CubeIDE needs for the Cortex-M7.
source [find interface/stlink-dap.cfg]
set AP_NUM 0
source [find target/stm32h7x.cfg]
